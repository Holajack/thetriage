# HikeWise Agent Swarm - n8n Docker Configuration
#
# Usage:
#   docker-compose -f docker-compose.n8n.yml up -d
#
# Access n8n at: http://localhost:5678

version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: hikewise-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Timezone
      - GENERIC_TIMEZONE=America/Chicago
      - TZ=America/Chicago

      # n8n Configuration
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/

      # Security (change in production!)
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=hikewise123

      # Execution settings
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=true
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true

      # API keys (loaded from .env file)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}

    volumes:
      # n8n data persistence
      - n8n_data:/home/node/.n8n

      # Mount project directory (read-only)
      - .:/project:ro

      # Mount workflows for import
      - ./n8n-workflows:/home/node/workflows:ro

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  n8n_data:
    driver: local

# Optional: Add a webhook proxy for external access
# networks:
#   default:
#     name: hikewise-network
